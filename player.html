<!DOCTYPE html>
<!--
  nexThing YouTube player page. Serve it from the youtube-scrape server
  (route /player) and open it as /player?id=VIDEO_ID&list=ID1,ID2,...

  Why it exists: the YouTube embed refuses to play without an http(s)
  origin/referrer. On Linux and macOS the app runs from tauri://localhost and
  sends none, so the app frames this page instead and this page frames
  YouTube with its own https origin.

  It plays `id`, then the videos after it in `list`, one by one; a video that
  cannot be embedded is skipped. Each video that starts is reported to the app
  with postMessage({ type: 'nexthing-youtube', event: 'playing', id }).
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>nexThing player</title>
  <style>
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
    iframe { display: block; width: 100%; height: 100%; border: 0; }
    p { color: #aaa; font: 13px system-ui, sans-serif; text-align: center; margin-top: 40vh; }
  </style>
</head>
<body>
  <div id="player"></div>
  <script>
    (function () {
      var VIDEO_ID = /^[A-Za-z0-9_-]{11}$/;
      var params = new URLSearchParams(location.search);
      var id = params.get('id') || '';
      // Only real YouTube video ids reach the player.
      if (!VIDEO_ID.test(id)) {
        var message = document.createElement('p');
        message.textContent = 'Invalid video id';
        document.body.replaceChildren(message);
        return;
      }
      var list = (params.get('list') || '').split(',').filter(function (item) { return VIDEO_ID.test(item); }).slice(0, 25);
      if (list.indexOf(id) < 0) list.unshift(id);
      var index = list.indexOf(id);
      var autoplay = params.get('autoplay') === '0' ? 0 : 1;
      var player;

      function report(videoId) {
        if (window.parent !== window) {
          window.parent.postMessage({ type: 'nexthing-youtube', event: 'playing', id: videoId }, '*');
        }
      }

      function playNext() {
        if (index + 1 >= list.length) return;
        index += 1;
        player.loadVideoById(list[index]);
        report(list[index]);
      }

      // The iframe is made here (not by the API) so its permissions are set before it loads.
      var frame = document.createElement('iframe');
      frame.id = 'player';
      frame.src = 'https://www.youtube-nocookie.com/embed/' + id +
        '?enablejsapi=1&autoplay=' + autoplay + '&rel=0&playsinline=1&origin=' + encodeURIComponent(location.origin);
      frame.title = 'YouTube video player';
      frame.allow = 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share';
      frame.referrerPolicy = 'strict-origin-when-cross-origin';
      frame.allowFullscreen = true;
      document.getElementById('player').replaceWith(frame);

      window.onYouTubeIframeAPIReady = function () {
        player = new YT.Player('player', {
          events: {
            onStateChange: function (event) {
              if (event.data === YT.PlayerState.ENDED) playNext();
            },
            // 2: bad id, 5: HTML5 error, 100: removed, 101/150: embedding not allowed.
            onError: playNext,
          },
        });
      };

      var api = document.createElement('script');
      api.src = 'https://www.youtube.com/iframe_api';
      document.head.appendChild(api);
    })();
  </script>
</body>
</html>
